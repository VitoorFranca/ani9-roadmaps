name: Validar modelos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formato de todos os modelos
        run: node scripts/validate.mjs
      - name: Links dos modelos alterados
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'models/*.json')
          if [ -n "$changed" ]; then node scripts/validate.mjs $changed --check-links; else echo "Nenhum modelo alterado."; fi
