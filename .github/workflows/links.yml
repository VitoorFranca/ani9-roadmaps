name: Links do catálogo

# Uma vez por semana, abre cada link de todos os modelos. Se algum quebrou,
# abre (ou atualiza) uma issue com o relatório.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar links
        id: check
        run: |
          set +e
          node scripts/validate.mjs --check-links > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Abrir ou atualizar a issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Links quebrados no catálogo"
          body=$(printf 'A verificação semanal encontrou problemas:\n\n```\n%s\n```\n' "$(grep -E '^(models/|ERRO)' report.txt)")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body" --label "link quebrado"; fi
